<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegOnline - Acceso Administrativo</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/x-icon">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { width: 100vw; height: 100vh; background: #f4f5f7; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        .login-title { font-size: 22px; color: #2c3e50; margin-bottom: 25px; font-weight: 600; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-label { display: block; font-size: 13px; color: #555; margin-bottom: 8px; font-weight: 600; }
        .form-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: #7b2cbf; }
        .btn-submit { width: 100%; padding: 12px; background: #7b2cbf; border: none; border-radius: 6px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #63209d; }
        .error-msg { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; text-align: left; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-title">Panel de Control</div>
        
        {% if error %}
        <div class="error-msg">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('login_admin') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="usuario">Usuario Administrador / Operador</label>
                <input type="text" id="usuario" name="usuario" class="form-input" placeholder="Ingrese su usuario" required autocomplete="off">
            </div>
            
            <button type="submit" class="btn-submit">Solicitar Código de Telegram</button>
        </form>
    </div>

</body>
</html>
